name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6.2"
  GODOT_SHORT: "4.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK (build-tools y plataforma)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK en: $ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Descargar Godot y plantillas de exportación
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --version

      - name: Bibliotecas de IA local (NobodyWho)
        run: tools/fetch_nobodywho.sh all

      - name: Keystore de depuración (generado en el runner, no se guarda en el repo)
        run: |
          keytool -genkey -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar Godot para Android
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_SHORT}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-${GODOT_SHORT}.tres
          cat ~/.config/godot/editor_settings-${GODOT_SHORT}.tres

      - name: Importar recursos
        run: godot --headless --path . --import || true

      - name: Pruebas automáticas del juego (headless)
        run: godot --headless --path . tests/test_runner.tscn

      - name: Exportar APK de depuración
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/TeleTimo3D-debug.apk
          ls -la build

      - name: APK x86_64 solo para el emulador de pruebas
        run: |
          # NobodyWho x86_64-android enlaza ONNX Runtime dinámicamente: se añade solo a este APK de pruebas
          for v in 1.31.0 1.30.0 1.29.0 1.28.0 1.27.0 1.26.0 1.25.0 1.24.0 1.23.2; do
            if curl -fsSL -o ort.aar https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/$v/onnxruntime-android-$v.aar; then echo "ONNX Runtime Android $v"; break; fi
          done
          unzip -o -j -q ort.aar "jni/x86_64/libonnxruntime.so" -d addons/nobodywho/
          readelf -d addons/nobodywho/libonnxruntime.so | grep NEEDED || true
          printf '\n[dependencies]\nandroid.x86_64 = {"res://addons/nobodywho/libonnxruntime.so": ""}\n' >> addons/nobodywho/nobodywho.gdextension
          godot --headless --path . --export-debug "AndroidX86Test" build/TeleTimo3D-x86_64-test.apk
          ls -la build

      - name: Verificar APK
        run: |
          test -s build/TeleTimo3D-debug.apk
          unzip -l build/TeleTimo3D-debug.apk | grep -E "AndroidManifest|classes.dex|lib/arm64-v8a" | head

      - uses: actions/upload-artifact@v4
        with:
          name: TeleTimo3D-debug-apk
          path: build/TeleTimo3D-debug.apk

      - name: Publicar Release única ("ultima-version", se sobrescribe en cada subida)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # una sola release: se borra la anterior (y las antiguas build-N) y se crea de nuevo con el APK nuevo
          for t in $(gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E '^(build-[0-9]+|ultima-version)$' || true); do
            gh release delete "$t" --cleanup-tag --yes || true
          done
          gh release create ultima-version build/TeleTimo3D-debug.apk \
            --target "$GITHUB_SHA" \
            --title "TeleTimo 3D - ultima version (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK de depuracion generado automaticamente desde ${GITHUB_SHA}. Se reemplaza en cada subida. Instalar permitiendo origenes desconocidos." \
            --prerelease
          gh release view evaluaciones >/dev/null 2>&1 || gh release create evaluaciones --title "Evaluaciones de la IA (CI)" --notes "Resultados de pruebas automáticas." --prerelease
          gh release upload evaluaciones build/TeleTimo3D-x86_64-test.apk --clobber
